<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <title>Seite nicht gefunden - Geofilter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Sora", system-ui, sans-serif;
      background: 
        radial-gradient(ellipse 80% 50% at 20% -20%, rgba(59, 130, 246, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 80% -10%, rgba(139, 92, 246, 0.06), transparent),
        linear-gradient(180deg, #f8f9fc 0%, #f0f4f8 100%);
      color: #6b7280;
      padding: 2rem;
      text-align: center;
    }

    .error-container {
      animation: float-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes float-in {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-code {
      font-family: "Fraunces", Georgia, serif;
      font-size: 8rem;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1d23;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }

    p {
      max-width: 320px;
      line-height: 1.6;
      margin: 0 auto 2rem;
      font-size: 0.95rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25);
      transition: all 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .back-link:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(59, 130, 246, 0.35);
    }

    .back-link:active {
      transform: translateY(0);
    }

    .back-link svg {
      width: 16px;
      height: 16px;
      transition: transform 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .back-link:hover svg {
      transform: translateX(-4px);
    }

    @media (max-width: 480px) {
      .error-code {
        font-size: 5rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      p {
        font-size: 0.875rem;
      }
    }
  </style>
</head>

<body>
  <div class="error-container">
    <div class="error-code">404</div>
    <h1>Seite nicht gefunden</h1>
    <p>Die von Ihnen gesuchte Seite existiert leider nicht oder wurde verschoben.</p>
    <a href="index.html" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Zur Startseite
    </a>
  </div>
</body>

</html>
